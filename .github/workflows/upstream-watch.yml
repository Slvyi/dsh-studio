name: upstream-watch

# Watch the published @deepseek-ai/dsh family for new releases and open an
# issue when our packaged runtime falls behind. DSH Studio's packaged mode
# pins the npm-published dsh; a new upstream release means we should bump
# dependencies and ship a new build.

"on":
  schedule:
    # every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream versions
        id: check
        run: node scripts/check-upstream.mjs --json > /tmp/upstream.json
        continue-on-error: true

      - name: Open issue when outdated
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/open-upstream-issue.mjs --file /tmp/upstream.json
